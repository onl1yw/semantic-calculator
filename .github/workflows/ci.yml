name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci --prefix frontend
      - run: python -m pytest -q
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: git diff --check
      - name: Scan files and Git history for secrets
        run: python scripts/security_scan.py
      - name: Audit JavaScript dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Audit Python dependencies
        run: |
          python -m venv /tmp/pip-audit
          /tmp/pip-audit/bin/pip install pip-audit==2.10.1
          /tmp/pip-audit/bin/pip-audit -r requirements.lock.txt --disable-pip --no-deps
