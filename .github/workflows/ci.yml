name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock.txt
      - run: npm ci --prefix frontend
      - run: python -m pytest -q
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend
      - run: git diff --check
      - name: Scan files and Git history for secrets
        run: python scripts/security_scan.py
      - name: Audit JavaScript dependencies
        run: npm audit --prefix frontend --audit-level=high
      - name: Audit Python dependencies
        run: |
          python -m venv /tmp/pip-audit
          /tmp/pip-audit/bin/pip install pip-audit==2.10.1
          /tmp/pip-audit/bin/pip-audit -r requirements.lock.txt --disable-pip --no-deps

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false
      - run: terraform -chdir=infra/yandex fmt -check
      - run: terraform -chdir=infra/yandex init -backend=false -input=false -lockfile=readonly
        env:
          TF_CLI_CONFIG_FILE: ${{ github.workspace }}/infra/yandex/terraform.rc
      - run: terraform -chdir=infra/yandex validate
